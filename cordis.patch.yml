# 0.1.2-rc.1 时代内置 bundle 不挂 authorization 服务，需在此 insert
# @deepseek-ai/dsh-authorization；0.1.7 起 runtime 已内置该服务，重复 provide
# 报 `service "authorization" has been registered`（入口不激活，journal 噪声）。
# v1.2.0 起仅适配 0.1.7+，不再 insert；旧版 DSH（≤0.1.5）请使用 1.1.x。
- insert:
    # 本插件 host 半区（web 树有 webServer 服务才会激活）
    # 路由前缀固定 /copilot-auth、不做配置项：client 侧 fetch 硬编码同一路径，
    # 配置一旦漂移 client 即 404（见附录 B）
    - id: copilot-auth
      name: '@inventec/dsh-copilot-auth'
# 3) 预置 GitHub Copilot 路由：entry config 作为 settings base 层，
#    用户 settings.yaml 的 llm-pi-ai: 节逐字段递归覆盖其上。
#    不写 apiKeyEnv → 认证走 OAuth 凭据记录（llm-pi-ai/github-copilot）。
#    带 name 做 mismatch 防御：未来 base 若改名，patch 警告而非错挂他行。
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      github-copilot:
        displayName: GitHub Copilot
